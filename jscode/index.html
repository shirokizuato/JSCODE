<tbody id="Coffee">

</tbody>

<script>

fetch('sample.json')
.then(response => response.json())
.then(data => {
    
    const table = document.getElementById('Coffee');

    data.forEach(Coffee => {
        const row = document.createElement('tr');

        row.innerHTML = `
        <td>${Coffee.Coffee}</td>
        <td>${Coffee.Size}</td>
        <td>PHP ${Coffee.Hot}</td>
        <td>PHP ${Coffee.Cold}</td>
        `;
        table.appendChild(row);


    });
})

.catch(error => console.error('Error loading JSON:', error));


</script>
