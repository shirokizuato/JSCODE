<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REST API Tester</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #fdf2e9; 
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px;
    gap: 20px;
  }

  .card {
    background: white;
    border-radius: 12px;
    /* Red-orange shadow */
    box-shadow: 0 4px 20px rgba(255, 103, 0, 0.15);
    width: 100%;
    max-width: 720px;
    overflow: hidden;
    border: 2px solid #ff6700;
  }

  .card-header {
    background: #ff6700; /* Naruto Orange */
    padding: 16px 20px;
    font-size: 0.9rem;
    font-weight: 800;
    color: white;
    display: flex;
    justify-content: space-between;
    align-items: center;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .url-text {
    font-size: 0.72rem;
    color: rgba(255, 255, 255, 0.8);
    font-weight: 400;
  }

  .methods {
    display: flex;
    padding: 20px 20px 0;
    gap: 8px;
    flex-wrap: wrap;
  }

  .method-btn {
    font-size: 0.75rem;
    font-weight: 700;
    padding: 8px 14px;
    border-radius: 4px;
    border: 2px solid;
    cursor: pointer;
    background: white;
    transition: all 0.2s;
    text-transform: uppercase;
  }

  /* Naruto-themed method colors */
  .method-btn[data-method="GET"]    { border-color: #ff6700; color: #ff6700; } /* Orange */
  .method-btn[data-method="POST"]   { border-color: #004d99; color: #004d99; } /* Sasuke Blue */
  .method-btn[data-method="PUT"]    { border-color: #e60000; color: #e60000; } /* Uzumaki Red */
  .method-btn[data-method="PATCH"]  { border-color: #5b2c6f; color: #5b2c6f; } /* Orochimaru Purple */
  .method-btn[data-method="DELETE"] { border-color: #333333; color: #333333; } /* Ink/Black */

  .method-btn.active { color: white !important; }
  .method-btn[data-method="GET"].active    { background: #ff6700; }
  .method-btn[data-method="POST"].active   { background: #004d99; }
  .method-btn[data-method="PUT"].active    { background: #e60000; }
  .method-btn[data-method="PATCH"].active  { background: #5b2c6f; }
  .method-btn[data-method="DELETE"].active { background: #333333; }

  .fields {
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .field {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .field label {
    font-size: 0.75rem;
    font-weight: 700;
    color: #ff6700;
    width: 75px;
    text-align: right;
    text-transform: uppercase;
  }

  .field input {
    flex: 1;
    border: 2px solid #ffe5d4;
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 0.85rem;
    outline: none;
    transition: border-color 0.2s;
  }

  .field input:focus { border-color: #ff6700; }

  .send-row {
    padding: 0 20px 20px;
    display: flex;
    justify-content: flex-end;
  }

  #sendBtn {
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 800;
    padding: 10px 30px;
    border: none;
    border-radius: 50px; /* Kunai-like curve */
    cursor: pointer;
    background: #ff6700;
    color: white;
    text-transform: uppercase;
    box-shadow: 0 4px 0 #cc5200;
    transition: transform 0.1s, box-shadow 0.1s;
  }

  #sendBtn:active {
    transform: translateY(2px);
    box-shadow: 0 2px 0 #cc5200;
  }

  .divider { height: 4px; background: #ffe5d4; }

  .response { padding: 20px; background: #fffaf7; }

  .status-badge {
    font-size: 0.75rem;
    font-weight: 800;
    padding: 4px 12px;
    border-radius: 4px;
    background: #eee;
    color: #888;
  }

  .status-badge.ok     { background: #ff6700; color: white; }
  .status-badge.create { background: #004d99; color: white; }
  .status-badge.err    { background: #e60000; color: white; }

  .status-text { font-size: 0.8rem; font-weight: 600; color: #555; }

  .response-body {
    background: white;
    border: 2px solid #ffe5d4;
    border-radius: 8px;
    padding: 15px;
    margin-top: 10px;
    font-size: 0.8rem;
  }

  .response-body .key { color: #ff6700; font-weight: 700; margin-right: 8px; }
  .response-body .val { color: #333; }

  .table-wrap { overflow-x: auto; padding: 0 20px 20px; }

  table { width: 100%; border-collapse: collapse; }
  th {
    padding: 12px;
    text-align: left;
    font-size: 0.7rem;
    color: #ff6700;
    border-bottom: 2px solid #ff6700;
  }
  td { padding: 12px; border-bottom: 1px solid #ffe5d4; font-size: 0.8rem; }
  
  .id-cell { font-weight: 800; color: #ff6700; }
</style>
</head>
<body>

<div class="card">
  <div class="card-header">
    <span>🍥API Tester</span>
    <span class="url-text" id="urlDisplay">jsonplaceholder.typicode.com/users</span>
  </div>

  <div class="methods">
    <button class="method-btn active" data-method="GET">GET</button>
    <button class="method-btn" data-method="POST">POST</button>
    <button class="method-btn" data-method="PUT">PUT</button>
    <button class="method-btn" data-method="PATCH">PATCH</button>
    <button class="method-btn" data-method="DELETE">DELETE</button>
  </div>

  <div class="fields">
    <div class="field" id="idRow" style="display:none">
      <label>ID</label>
      <input id="fId" type="number" value="1" min="1" max="10">
    </div>
    <div class="field" id="nameRow" style="display:none">
      <label>Name</label>
      <input id="fName" value="Naruto Uzumaki">
    </div>
    <div class="field" id="usernameRow" style="display:none">
      <label>Username</label>
      <input id="fUsername" value="Hokage">
    </div>
    <div class="field" id="emailRow" style="display:none">
      <label>Email</label>
      <input id="fEmail" value="leaf@hidden.com">
    </div>
    <div class="field" id="addressRow" style="display:none">
      <label>Address</label>
      <input id="fAddress" value="Konoha">
    </div>
    <p id="getNote" style="font-size:0.75rem;color:#b35900;padding-left:87px;font-style:italic;">Fetching Users...</p>
  </div>

  <div class="send-row">
    <button id="sendBtn" onclick="sendRequest()">SEND</button>
  </div>

  <div class="divider"></div>

  <div class="response">
    <div class="response-row" style="display:flex; align-items:center; gap:10px;">
      <span class="status-badge" id="statusBadge">—</span>
      <span class="status-text" id="statusText">Waiting for output...</span>
    </div>
    <div class="response-body" id="responseBody" style="display:none"></div>
  </div>

  <div class="table-wrap" id="tableWrap" style="display:none">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Username</th>
          <th>Email</th>
          <th>City</th>
        </tr>
      </thead>
      <tbody id="userTableBody"></tbody>
    </table>
  </div>
</div>

<script>
  const BASE = 'https://jsonplaceholder.typicode.com';
  let method = 'GET';

  const COLORS = { GET:'#ff6700', POST:'#004d99', PUT:'#e60000', PATCH:'#5b2c6f', DELETE:'#333333' };

  function updateUI() {
    const isGET = method === 'GET';
    const isDELETE = method === 'DELETE';
    const needsBody = !['GET','DELETE'].includes(method);

    document.getElementById('getNote').style.display = isGET ? 'block' : 'none';
    document.getElementById('idRow').style.display = isGET ? 'none' : 'flex';
    ['nameRow','usernameRow','emailRow','addressRow'].forEach(id => {
      document.getElementById(id).style.display = (isGET || isDELETE) ? 'none' : 'flex';
    });

    if (isGET) {
      document.getElementById('urlDisplay').textContent = 'jsonplaceholder.typicode.com/users';
    } else {
      const id = document.getElementById('fId').value || '1';
      document.getElementById('urlDisplay').textContent = `jsonplaceholder.typicode.com/users/${id}`;
    }

    document.getElementById('sendBtn').style.background = COLORS[method];
    document.getElementById('sendBtn').style.boxShadow = `0 4px 0 ${COLORS[method]}88`;
  }

  document.querySelectorAll('.method-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.method-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      method = btn.dataset.method;
      updateUI();
    });
  });

  document.getElementById('fId').addEventListener('input', updateUI);

  async function sendRequest() {
    const id = document.getElementById('fId').value || '1';
    let url = (method === 'GET' || method === 'POST') ? `${BASE}/users` : `${BASE}/users/${id}`;

    const opts = { method, headers: { 'Content-Type': 'application/json' } };
    if (!['GET','DELETE'].includes(method)) {
      opts.body = JSON.stringify({
        id: +id,
        name: document.getElementById('fName').value,
        username: document.getElementById('fUsername').value,
        email: document.getElementById('fEmail').value,
        address: { city: document.getElementById('fAddress').value }
      });
    }

    const btn = document.getElementById('sendBtn');
    btn.textContent = 'Wait...';
    
    try {
      const res = await fetch(url, opts);
      const data = await res.json();
      
      const badge = document.getElementById('statusBadge');
      badge.textContent = res.status;
      badge.className = 'status-badge ' + (res.status === 201 ? 'create' : res.status < 300 ? 'ok' : 'err');
      document.getElementById('statusText').textContent = res.status < 300 ? 'Success!' : 'Failed!';

      if (method === 'GET' && Array.isArray(data)) {
        renderTable(data);
      } else {
        renderSingle(res.status, data, id);
      }
    } catch (e) {
      document.getElementById('statusText').textContent = 'Error detected (Error)!';
    }
    btn.textContent = 'SEND';
  }

  function renderTable(users) {
    document.getElementById('responseBody').style.display = 'none';
    const wrap = document.getElementById('tableWrap');
    const tbody = document.getElementById('userTableBody');
    tbody.innerHTML = '';
    users.forEach(u => {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td class="id-cell">${u.id}</td><td>${u.name}</td><td>${u.username}</td><td>${u.email}</td><td>${u.address?.city}</td>`;
      tbody.appendChild(tr);
    });
    wrap.style.display = 'block';
  }

  function renderSingle(status, data, id) {
  document.getElementById('tableWrap').style.display = 'none';
  const body = document.getElementById('responseBody');
  body.style.display = 'block';
  body.innerHTML = ''; 

  if (method === 'DELETE') {
    body.innerHTML = `User #${id} has been removed.`;
    return;
  }

  const fieldsToShow = [
    { label: 'ID', value: data.id },
    { label: 'Name', value: data.name },
    { label: 'Username', value: data.username },
    { label: 'Address', value: data.address?.city || 'Unknown' },
    { label: 'E-mail', value: data.email },

  ];

  fieldsToShow.forEach(field => {
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `<span class="key">${field.label}:</span><span class="val">${field.value}</span>`;
    body.appendChild(row);
  });
}

  updateUI();
</script>
</body>
</html>
